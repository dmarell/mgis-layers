[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis_layers"
version = "0.2.0"
description = "Fetch and query Swedish map layers (elevation, land use, roads, obstacles, tree height, buildings) and sample terrain profiles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Marell" }]
dependencies = [
    "numpy>=1.24",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/dmarell/mgis-layers"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
plot = ["matplotlib>=3.7"]

[project.scripts]
gis-layers = "gis_layers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
